  #     restart: unless-stopped

  redis:
    healthcheck:
      retries: 3
      test:
        - CMD
        - redis-cli
        - ping
      timeout: 5s
    image: redis:alpine
    networks:
      - sail
    ports:
      - ${FORWARD_REDIS_PORT:-6379}:6379
    volumes:
      - source: sail-redis
        target: /data
        type: volume
        volume: {}
  mailpit:
    image: "axllent/mailpit:latest"
    ports:
      - "${FORWARD_MAILPIT_PORT:-1025}:1025"
      - "${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025"
    networks:
      - sail
  cloudflared:
    build:
      context: "./docker/cloudflared"
      dockerfile: Dockerfile
    image: "sail-cloudflared/app"
    entrypoint: ["/var/www/html/bin/start-cloudflared.sh"]
    environment:
      DOCKER: "true"
      REVERB_SERVER_PORT: "${REVERB_SERVER_PORT:-8080}"
    volumes:
      - ".:/var/www/html"
    networks:
      - sail
    depends_on:
      - application

networks:
  sail:
    driver: bridge
    name: istic-manage_sail
volumes:
  sail-redis:
    driver: local
    name: istic-manage_sail-redis
